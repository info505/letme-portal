name: Portal build check
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - design/central-brand-brevo-20261118
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect generated React Router types
        run: |
          test ! -f .react-router/types/+routes.ts || sed -n "195,218p" .react-router/types/+routes.ts
      - run: npm run typecheck
