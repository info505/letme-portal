name: Portal build check
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - design/central-brand-brevo-20261118
concurrency:
  group: portal-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect generated React Router types
        run: |
          npx react-router typegen
          if test -f .react-router/types/+routes.ts; then nl -ba .react-router/types/+routes.ts | sed -n "192,220p"; fi
      - run: npm run typecheck
